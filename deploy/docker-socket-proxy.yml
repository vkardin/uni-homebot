# Доступ HomeBot к Docker ТОЛЬКО НА ЧТЕНИЕ: список контейнеров и их журналы.
# POST запрещён (POST=0): через прокси нельзя создать, удалить или перезапустить контейнер.
# Перезапуск идёт отдельно — через root-юнит homebot-docker-restart@.service и polkit.
# Запускается deploy/update.sh:  docker compose -p homebot -f deploy/docker-socket-proxy.yml up -d
services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homebot-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"  # только localhost — снаружи не виден
