# UNI из готового образа, без сборки (amd64 и arm64, в том числе Raspberry Pi 4/5):
#   docker compose -f compose.ghcr.yml up -d
# Обновление: docker compose -f compose.ghcr.yml pull && docker compose -f compose.ghcr.yml up -d
# Остальное — как в compose.yml (сеть хоста, данные в томе homebot-data, Docker только на чтение).
name: homebot

services:
  homebot:
    image: ghcr.io/vkardin/uni-homebot:latest
    container_name: homebot
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      STATE_DIR: /data
    volumes:
      - homebot-data:/data
    depends_on:
      - docker-proxy

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homebot-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"

volumes:
  homebot-data:
